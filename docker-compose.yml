services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcc
      POSTGRES_PASSWORD: gcc
      POSTGRES_DB: gcc_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcc -d gcc_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis 8 bundles the JSON + Search modules required by langgraph-checkpoint-redis
    image: redis:8
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gcc:gcc@postgres:5432/gcc_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}

volumes:
  pgdata:
  redisdata:
  qdrantdata:
